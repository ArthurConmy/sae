[tool.poetry]
name = "sae"
version = "0.1.0"
description = "This poetry setup was not working with `poetry install` on RunPod.io GPUs, so I just used `pip install -e .` in practice."
authors = ["Arthur Conmy"]
readme = "README.md"
packages = [{include = "sae"}]

[tool.poetry.dependencies]
python = ">=3.10, <3.13" # 3.10+ is required by the patched urllib3/pillow/anyio/aiohttp/torch releases that fix known CVEs
torch = ">=2.6, <3.0"
ruff = "^0.1.3"
einops = "^0.7.0"
transformer-lens = "^3.9.0" # pulls transformers >=5.9 (4.x has many RCE CVEs)
wandb = "^0.30.0" # needs protobuf >=5 (4.x has CVE-2026-0994)
plotly = "^5.18.0"
circuitsvis = "^1.43.1"
line_profiler = "^4.1.1"
matplotlib = "^3.8.1"
ipython = "^8.14.0"
datasets = "^5.0.1" # <5.0.1 has CVE-2026-66007
ipywidgets = "^8.1.1"
jupyter = "^1.0.0"
pyarrow = ">=21" # Transitive via datasets; <17 has CVE-2024-52338, 14.0.0 has an IPC deserialization RCE (CVE-2023-47248)

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
